<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yassin Creative Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #f4f6f8;
  color: #222;
  line-height: 1.6;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 60px 20px;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(32px,4vw,48px);
}

h2 {
  font-size: clamp(24px,3vw,32px);
  margin-bottom: 10px;
}

p {
  color: #555;
}

.hero {
  text-align: center;
  background: linear-gradient(135deg, #ffe0c3, #ffd1dc);
  border-radius: 16px;
}

.hero img {
  max-width: 320px;
  margin-top: 20px;
}

.section {
  margin-top: 60px;
}

.section img {
  max-width: 220px;
  margin-top: 20px;
}

.impact {
  display: flex;
  gap: 30px;
  flex-wrap: wrap;
  background: #fff;
  padding: 30px;
  border-radius: 16px;
}

.impact img {
  max-width: 240px;
}

.portfolio-grid {
  <div class="container section" id="portfolio-detail" style="display:none;">
  <button id="back-btn" style="
    background:none;
    border:none;
    font-size:16px;
    cursor:pointer;
    margin-bottom:20px;
  ">← Back</button>

  <h2 id="detail-title"></h2>
  <p id="detail-desc"></p>
  <img id="detail-image" style="max-width:600px;border-radius:12px;">
</div>
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-top: 20px;
}
.portfolio-item {
  background: #fff;
  padding: 16px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
}

.portfolio-item img {
  max-width: 100%;
  border-radius: 8px;
}

footer {
  text-align: center;
  padding: 40px 0;
  color: #777;
}

@media (max-width: 600px) {
  .impact {
    flex-direction: column;
    text-align: center;
  }
}
</style>
</head>
<body>

<div class="container hero">
  <h1 id="hero-title"></h1>
  <p id="hero-subtitle"></p>
  <img id="hero-image" alt="Heroharm">
</div>

<div class="container section">
  <h2 id="about-title"></h2>
  <p id="about-desc"></p>
  <img id="about-image" alt="About image">
</div>

<div class="container section impact">
  <img id="impact-image" alt="Impact image">
  <div>
    <h2 id="impact-title"></h2>
    <p id="impact-desc"></p>
  </div>
</div>

<div class="container section">
  <h2>Portfolio</h2>
  <div class="portfolio-grid" id="portfolio-grid"></div>
</div>

<footer id="footer"></footer>

<script>
fetch('data.json')
  .then(res => res.json())
  .then(data => {
    document.getElementById('hero-title').textContent = data.hero.title;
    document.getElementById('hero-subtitle').textContent = data.hero.subtitle;
    document.getElementById('hero-image').src = data.hero.image;

    document.getElementById('about-title').textContent = data.about.title;
    document.getElementById('about-desc').textContent = data.about.description;
    document.getElementById('about-image').src = data.about.image;

    document.getElementById('impact-title').textContent = data.impact.title;
    document.getElementById('impact-desc').textContent = data.impact.description;
    document.getElementById('impact-image').src = data.impact.image;

    const grid = document.getElementById('portfolio-grid');
    data.portfolio.forEach(item => {
      const grid = document.getElementById('portfolio-grid');
const detailPage = document.getElementById('portfolio-detail');

data.portfolio.forEach(item => {
  const div = document.createElement('div');
  div.className = 'portfolio-item';
  div.innerHTML = `
    <img src="${item.image}" alt="${item.title}">
    <p><strong>${item.title}</strong></p>
  `;

  div.addEventListener('click', () => {
    document.querySelector('.portfolio-grid').style.display = 'none';
    detailPage.style.display = 'block';

    document.getElementById('detail-title').textContent = item.title;
    document.getElementById('detail-desc').textContent = item.description;
    document.getElementById('detail-image').src = item.image;

    detailPage.scrollIntoView({ behavior: 'smooth' });
  });

  grid.appendChild(div);
});

document.getElementById('back-btn').addEventListener('click', () => {
  detailPage.style.display = 'none';
  document.querySelector('.portfolio-grid').style.display = 'grid';
});
    });

    document.getElementById('footer').textContent = data.footer;
  })
  .catch(err => console.error('JSON ERROR:', err));
</script>

</body>
</html>
