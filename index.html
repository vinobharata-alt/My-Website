<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yassin Creative Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #f4f6f8;
  color: #222;
  line-height: 1.6;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 60px 20px;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(32px,4vw,48px);
}

h2 {
  font-size: clamp(24px,3vw,32px);
  margin-bottom: 10px;
}

p {
  color: #555;
}

.hero {
  text-align: center;
  background: linear-gradient(135deg, #ffe0c3, #ffd1dc);
  border-radius: 20px;
}

.hero img {
  max-width: 320px;
  margin-top: 24px;
}

.section {
  margin-top: 70px;
}

.section img {
  max-width: 220px;
  margin-top: 20px;
}

.impact {
  display: flex;
  gap: 30px;
  flex-wrap: wrap;
  background: #fff;
  padding: 40px;
  border-radius: 20px;
}

.impact img {
  max-width: 260px;
}

.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 24px;
  margin-top: 30px;
}

.portfolio-item {
  background: #fff;
  padding: 18px;
  border-radius: 16px;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(0,0,0,0.06);
  transition: transform .2s ease, box-shadow .2s ease;
}

.portfolio-item:hover {
  transform: translateY(-4px);
  box-shadow: 0 16px 40px rgba(0,0,0,0.1);
}

.portfolio-item img {
  max-width: 100%;
  border-radius: 10px;
}

#portfolio-detail {
  display: none;
}

#back-btn {
  background: none;
  border: none;
  font-size: 16px;
  cursor: pointer;
  margin-bottom: 20px;
}

footer {
  text-align: center;
  padding: 50px 0;
  color: #777;
}

@media (max-width: 600px) {
  .impact {
    flex-direction: column;
    text-align: center;
  }
}
</style>
</head>
<body>

<!-- HERO -->
<div class="container hero">
  <h1 id="hero-title"></h1>
  <p id="hero-subtitle"></p>
  <img id="hero-image" alt="Hero image">
</div>

<!-- ABOUT -->
<div class="container section">
  <h2 id="about-title"></h2>
  <p id="about-desc"></p>
  <img id="about-image" alt="About image">
</div>

<!-- IMPACT -->
<div class="container section impact">
  <img id="impact-image" alt="Impact image">
  <div>
    <h2 id="impact-title"></h2>
    <p id="impact-desc"></p>
  </div>
</div>

<!-- PORTFOLIO GRID -->
<div class="container section" id="portfolio-home">
  <h2>Portfolio</h2>
  <div class="portfolio-grid" id="portfolio-grid"></div>
</div>

<!-- PORTFOLIO DETAIL -->
<div class="container section" id="portfolio-detail">
  <button id="back-btn">← Back</button>
  <h2 id="detail-title"></h2>
  <p id="detail-desc"></p>
  <img id="detail-image" style="max-width:600px;border-radius:16px;">
</div>

<footer id="footer"></footer>

<script>
fetch('data.json')
  .then(res => res.json())
  .then(data => {

    // Hero
    hero-title.textContent = data.hero.title;
    hero-subtitle.textContent = data.hero.subtitle;
    hero-image.src = data.hero.image;

    // About
    about-title.textContent = data.about.title;
    about-desc.textContent = data.about.description;
    about-image.src = data.about.image;

    // Impact
    impact-title.textContent = data.impact.title;
    impact-desc.textContent = data.impact.description;
    impact-image.src = data.impact.image;

    // Portfolio
    const grid = document.getElementById('portfolio-grid');
    const detail = document.getElementById('portfolio-detail');
    const home = document.getElementById('portfolio-home');

    data.portfolio.forEach(item => {
      const card = document.createElement('div');
      card.className = 'portfolio-item';
      card.innerHTML = `
        <img src="${item.image}">
        <p><strong>${item.title}</strong></p>
      `;
      card.onclick = () => {
        home.style.display = 'none';
        detail.style.display = 'block';
        detail-title.textContent = item.title;
        detail-desc.textContent = item.description;
        detail-image.src = item.image;
        detail.scrollIntoView({behavior:'smooth'});
      };
      grid.appendChild(card);
    });

    back-btn.onclick = () => {
      detail.style.display = 'none';
      home.style.display = 'block';
    };

    footer.textContent = data.footer;
  });
</script>

</body>
</html>
