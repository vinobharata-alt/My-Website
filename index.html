<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yassin Creative Studio</title>

<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: auto;
    padding: 20px;
    line-height: 1.6;
  }

  h1 {
    font-size: clamp(26px, 4vw, 36px);
  }

  h2 {
    font-size: clamp(22px, 3vw, 28px);
  }

  p, li {
    font-size: clamp(16px, 2.5vw, 18px);
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
  }

  button {
    padding: 12px 22px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #007bff;
    color: white;
  }

  button:hover {
    background: #0056b3;
  }

  ul {
    padding-left: 20px;
  }

  /* PAGE */
  #portfolio-page {
    display: none;
  }

  .back-btn {
    background: #333;
    margin-bottom: 20px;
  }

  /* PORTFOLIO GRID */
  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }

  .portfolio-item {
    border-radius: 10px;
    overflow: hidden;
  }

  .portfolio-item img {
    width: 100%;
    transition: transform 0.3s ease;
  }

  .portfolio-item:hover img {
    transform: scale(1.05);
  }

  .portfolio-title {
    margin-top: 8px;
    font-weight: bold;
    text-align: center;
  }
</style>
</head>
<body>

<!-- ===== MAIN PAGE ===== -->
<div id="main-page">
  <h1 id="brand"></h1>
  <p id="tagline"></p>
  <img id="site-foto">

  <h2 id="hero-title"></h2>
  <p id="hero-subtitle"></p>
  <button id="hero-cta"></button>

  <h2 id="about-title"></h2>
  <p id="about-description"></p>

  <h2>Services</h2>
  <ul id="services-list"></ul>
</div>

<!-- ===== PORTFOLIO PAGE ===== -->
<div id="portfolio-page">
  <button class="back-btn" id="back-btn">← Back</button>
  <h1>My Portfolio</h1>

  <div class="portfolio-grid" id="portfolio-grid"></div>
</div>

<footer id="footer"></footer>

<script>
fetch('data.json')
  .then(res => res.json())
  .then(data => {

    // MAIN
    brand.textContent = data.site.brand;
    tagline.textContent = data.site.tagline;
    site_foto.src = data.site.foto;

    hero_title.textContent = data.hero.title;
    hero_subtitle.textContent = data.hero.subtitle;
    hero_cta.textContent = data.hero.cta;

    about_title.textContent = data.about.title;
    about_description.textContent = data.about.description;

    data.services.forEach(s => {
      const li = document.createElement('li');
      li.textContent = s;
      services_list.appendChild(li);
    });

    footer.textContent = data.footer;

    // PORTFOLIO
    data.portfolio.forEach(item => {
      const div = document.createElement('div');
      div.className = 'portfolio-item';
      div.innerHTML = `
        <img src="${item.image}">
        <div class="portfolio-title">${item.title}</div>
      `;
      portfolio_grid.appendChild(div);
    });

    // NAVIGATION
    hero_cta.onclick = () => {
      location.hash = 'portfolio';
      showPortfolio();
    };

    back_btn.onclick = () => {
      location.hash = '';
      showMain();
    };

    function showPortfolio() {
      main_page.style.display = 'none';
      portfolio_page.style.display = 'block';
      scrollTo(0,0);
    }

    function showMain() {
      portfolio_page.style.display = 'none';
      main_page.style.display = 'block';
      scrollTo(0,0);
    }

    if (location.hash === '#portfolio') showPortfolio();
  });
</script>

</body>
</html>
